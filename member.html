
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Management</title>
    <link rel="stylesheet" href="member.css">
</head>
<body>
    <style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background-color: #123C3A;
    color: white;
}

header {
    background-color: #092B29;
    text-align: center;
    padding: 25px;
}

header p {
    margin-top: 10px;
}

.container {
    width: 90%;
    max-width: 1000px;
    margin: 30px auto;
    padding: 25px;
    background-color: #205B55;
    border-radius: 12px;
}

h2 {
    margin: 20px 0;
    color: #99F6E4;
}

form {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

input {
    padding: 13px;
    border: 2px solid #5EEAD4;
    border-radius: 6px;
    font-size: 15px;
}

input:focus {
    outline: 2px solid white;
}

button {
    padding: 12px;
    border: none;
    border-radius: 6px;
    background-color: #5EEAD4;
    color: #092B29;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    opacity: 0.85;
}

.clear {
    background-color: #CBD5E1;
}

.edit {
    background-color: #FACC15;
    margin: 3px;
}

.delete {
    background-color: #F87171;
    margin: 3px;
}

.back {
    margin-top: 25px;
    background-color: #092B29;
    color: white;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
    background-color: white;
    color: #123C3A;
}

th, td {
    padding: 12px;
    border: 1px solid #CBD5E1;
    text-align: center;
}

th {
    background-color: #092B29;
    color: white;
}

#message {
    margin-top: 15px;
    color: #A7F3D0;
    font-weight: bold;
}

@media (max-width: 650px) {
    .container {
        overflow-x: auto;
    }

    table {
        min-width: 650px;
    }

    header h1 {
        font-size: 20px;
    }
}

    </style>

<header>
    <h1>Digital Library Management System</h1>
    <p>Member Management</p>
</header>

<div class="container">

    <h2>Add Member Details</h2>

    <form id="memberForm">

        <input type="hidden" id="memberId">

        <input type="text" id="name"
        placeholder="Enter Member Name" required>

        <input type="email" id="email"
        placeholder="Enter Email Address" required>

        <input type="tel" id="phone"
        placeholder="Enter 10 Digit Phone Number"
        pattern="[0-9]{10}" required>

        <input type="text" id="department"
        placeholder="Enter Department" required>

        <button type="submit" id="saveBtn">
            Add Member
        </button>

        <button type="button" class="clear"
        onclick="clearForm()">Clear</button>

    </form>

    <p id="message"></p>

    <h2>Member List</h2>

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Department</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="memberList"></tbody>
    </table>

    <button class="back" onclick="goDashboard()">
        Back to Dashboard
    </button>

</div>

<script>

// Get Members from Local Storage
let members = JSON.parse(localStorage.getItem("members")) || [];

// Add or Update Member
document.getElementById("memberForm")
.addEventListener("submit", function(event) {

    event.preventDefault();

    // Enter Member Details
    let id = document.getElementById("memberId").value;

    let name = document.getElementById("name").value.trim();
    let email = document.getElementById("email").value.trim();
    let phone = document.getElementById("phone").value.trim();
    let department = document.getElementById("department").value.trim();

    // Validate Input
    if (!name || !email || !phone || !department) {
        alert("Please fill all fields!");
        return;
    }

    if (!/^[0-9]{10}$/.test(phone)) {
        alert("Enter a valid 10-digit phone number!");
        return;
    }

    // Create Member Object
    let member = {
        name: name,
        email: email,
        phone: phone,
        department: department
    };

    // Add Member
    if (id === "") {

        members.push(member);

        showMessage("Member Added Successfully!");

    } else {

        // Modify Member Details
        members[Number(id)] = member;

        showMessage("Member Updated Successfully!");
    }

    // Save into Local Storage
    localStorage.setItem("members", JSON.stringify(members));

    clearForm();
    displayMembers();

});


// Display Member List
function displayMembers() {

    let memberList = document.getElementById("memberList");

    memberList.innerHTML = "";

    members.forEach(function(member, index) {

        let row = document.createElement("tr");

        [member.name, member.email, member.phone, member.department]
        .forEach(function(value) {

            let cell = document.createElement("td");
            cell.textContent = value;
            row.appendChild(cell);

        });

        let actionCell = document.createElement("td");

        // Edit Button
        let editButton = document.createElement("button");
        editButton.textContent = "Edit";
        editButton.className = "edit";

        editButton.onclick = function() {
            editMember(index);
        };

        // Delete Button
        let deleteButton = document.createElement("button");
        deleteButton.textContent = "Delete";
        deleteButton.className = "delete";

        deleteButton.onclick = function() {
            deleteMember(index);
        };

        actionCell.append(editButton, deleteButton);

        row.appendChild(actionCell);
        memberList.appendChild(row);

    });
}


// Edit Member
function editMember(index) {

    let member = members[index];

    document.getElementById("memberId").value = index;
    document.getElementById("name").value = member.name;
    document.getElementById("email").value = member.email;
    document.getElementById("phone").value = member.phone;
    document.getElementById("department").value = member.department;

    document.getElementById("saveBtn").textContent = "Update Member";

    showMessage("Modify Member Details");
}


// Delete Member
function deleteMember(index) {

    let confirmDelete = confirm(
        "Are you sure you want to delete this member?"
    );

    if (confirmDelete) {

        members.splice(index, 1);

        localStorage.setItem("members", JSON.stringify(members));

        displayMembers();

        showMessage("Member Deleted Successfully!");

    }
}


// Clear Form
function clearForm() {

    document.getElementById("memberForm").reset();

    document.getElementById("memberId").value = "";

    document.getElementById("saveBtn").textContent = "Add Member";
}


// Success Message
function showMessage(text) {

    document.getElementById("message").textContent = text;
}


// Back to Dashboard
function goDashboard() {

    window.location.href = "dashboard.html";
}


// Load Members
displayMembers();

</script>

</body>
</html>
